st:[["Kook de aardappelen: schil de aardappelen en spoel ze af. Snijd ze in stukken van 3 cm. Doe ze in een grote pan en zet ze net onder water. Breng aan de kook en kook ze 15 tot 20 minuten. Ze zijn gaar als een vork er makkelijk in gaat.","Schilmesje, snijplank, mes, grote pan"],["Kook de eieren: doe dit terwijl de aardappelen koken. Leg de eieren voorzichtig in een pan met kokend water en kook ze 8 minuten. Spoel ze koud af, pel ze en snijd ze doormidden.","Kleine pan, lepel, mes"],["Maak alles klaar: knip de uiteinden van de sperziebonen af en snijd de bonen in tweeën. Snijd de kool in dunne reepjes. Spoel de taugé af in een vergiet. Hak de knoflook en de peper fijn. Dep de tofu droog met keukenpapier en snijd hem in blokjes.","Snijplank, mes, vergiet, keukenpapier"],["Maak de pindasaus: verhit de helft van de olie in een steelpan op laag vuur en bak de knoflook en de peper 1 minuut. Doe de pindakaas, het water, de ketjap en het sap van de limoen erbij. Laat 5 minuten zachtjes koken en roer steeds. Is de saus te dik? Voeg dan een scheutje water toe. Zet het vuur zo laag mogelijk om hem warm te houden.","Steelpan, houten lepel, citruspers of mes"],["Kook de groenten: schep de gare aardappelen met een schuimspaan uit de pan en laat ze uitlekken in een vergiet. Kook in hetzelfde water de bonen 5 minuten. Doe de kool erbij voor de laatste 2 minuten en de taugé voor de laatste minuut. Giet alles af.","Schuimspaan, vergiet, grote pan"],["Bak de tofu: verhit de rest van de olie in een koekenpan op middelhoog vuur. Bak de tofu 8 minuten tot hij goudbruin is en draai hem af en toe om.","Koekenpan, spatel"],["Serveer: leg de aardappel, bonen, kool, taugé, tofu en ei op een grote schaal. Schenk de warme saus erover of zet hem er apart bij. Serveer met kroepoek.","Grote schaal, lepel"]],
tip:"Dit gerecht is al vegetarisch. Gewone kroepoek bevat vaak garnaal, dus kies een soort zonder. Alle groenten kun je een dag eerder klaarmaken. Warm de saus op met een scheutje water."},

st:[["Week de stokjes: doe dit als eerste. Leg de satéstokjes 20 minuten in een bak met water. Dan verbranden ze niet in de pan.","Bak of kom"],KV,["Maak de marinade: schil de gember en de knoflook en hak ze fijn. Doe ze in een mengkom met de ketjap, de ketoembar en de olie. Roer de kip erdoor. Dek de kom af met een bord of folie en zet hem 20 minuten in de koelkast.","Mengkom, mes, bord of folie"],RW,RK,["Maak de pindasaus: doe dit terwijl de rijst kookt. Doe de pindakaas, het water, de ketjap, de sambal en het sap van de limoen in een steelpan. Verwarm op laag vuur en roer tot de saus glad is, ongeveer 5 minuten. Zet het vuur zo laag mogelijk om de saus warm te houden.","Steelpan, houten lepel, citruspers of mes"],["Rijg de spiesjes: haal de kip uit de koelkast en de stokjes uit het water. Prik 4 stukjes kip aan elk stokje, dicht tegen elkaar. Was daarna je handen met zeep.","Satéstokjes"],["Bak de spiesjes: verhit een grillpan op middelhoog vuur. Bak de spiesjes 10 tot 12 minuten en draai ze regelmatig. Snijd één stukje door om te kijken: het vlees moet wit zijn zonder roze sap.","Grillpan, tang of vork"],["Serveer: de rijst is nu klaar en nog warm onder het deksel. Schep de rijst op borden, leg de spiesjes erbij en schenk de saus erover of zet hem apart.","Borden"]],
tip:"Kipdijfilet blijft sappiger dan kipfilet van de borst."},

st:[["Week de noedels: doe dit als eerste. Leg de noedels in een kom met lauw water, zodat ze onder water staan. Laat ze 20 minuten weken tot ze buigzaam zijn maar nog stevig.","Grote kom"],["Snijd alles: hak de knoflook fijn. Snijd de lente-ui in ringen en houd het wit en het groen apart. Snijd de limoen in partjes en hak de pinda’s grof.","Snijplank, mes"],["Maak de saus: roer de vissaus, de tamarindepasta en de suiker door elkaar in een kleine kom. Roer tot de suiker is opgelost.","Kleine kom, lepel"],["Maak de garnalen droog: spoel de garnalen af in een vergiet en dep ze goed droog met keukenpapier. Zo spatten ze niet in de hete pan. Giet nu ook de noedels af.","Vergiet, keukenpapier"],["Bak de garnalen: verhit de helft van de olie in een wok op hoog vuur. Bak de garnalen 2 minuten tot ze roze zijn en leg ze op een bord.","Wok, spatel, bord"],["Bak de knoflook en het ei: doe de rest van de olie in de wok. Bak de knoflook en het wit van de lente-ui 30 seconden. Breek de eieren in de wok en roer ze tot kleine stukjes die gestold zijn.","Wok, spatel"],["Bak de noedels: voeg de noedels en de saus toe. Bak 3 minuten en roer steeds. Zijn de noedels nog hard? Voeg dan een scheutje water toe. Doe de garnalen, de taugé en het groen van de lente-ui erbij en bak nog 1 minuut.","Wok, spatel"],["Serveer: schep de noedels op borden. Strooi de pinda’s erover en leg er een partje limoen bij. Knijp de limoen erover vlak voor het eten.","Borden"]],
tip:"Maak pad thai in kleine porties. In een volle pan worden de noedels papperig."}

intro:"Gebakken rijst met tempeh, wortel, boontjes en ei. Dezelfde smaak als de klassieker, zonder vlees.",
all:["Ei","Soja","Gluten (in ketjap manis)"],
gerei:["Zeef","Pan met deksel of rijstkoker","Vork","Snijplank","Scherp mes","Knoflookpers (of mes)","Groot bord","Wok of grote koekenpan","Spatel of houten lepel","Kleine koekenpan","Borden"],
ing:[["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"],["Tempeh",200,"g","s"],["Wortel",1,"stuk|stuks","s"],["Sperziebonen",100,"g","s"],["Sjalotten",2,"stuk|stuks","s",[2,"tl","uienpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse rode peper",1,"stuk|stuks","s",[1,"tl","sambal oelek"]],["Ketjap manis",4,"el","t"],["Eieren",4,"stuk|stuks","s"],["Zonnebloemolie",3,"el","s"],["Gebakken uitjes",3,"el","t"],["Komkommer",1,"stuk|stuks","s"],["Tomaten",2,"stuk|stuks","s"]],
st:[RW,RK,["Snijd de groenten: doe dit terwijl de rijst kookt. Schil de sjalotten en snijd ze fijn. Schil de knoflook en hak hem fijn of pers hem. Snijd de peper door de lengte, haal de zaadjes eruit en snijd hem fijn. Schil de wortel en snijd hem in kleine blokjes. Knip de uiteinden van de bonen af en snijd de bonen in stukjes van 1 cm. Was daarna je handen, want peper brandt in je ogen.","Snijplank, mes, knoflookpers"],["Maak de tempeh klaar: haal de tempeh uit de verpakking en snijd hem in blokjes van 1,5 cm. Tempeh eet je altijd gebakken of gekookt.","Snijplank, mes"],["Laat de rijst afkoelen: heb je de rijst de dag ervoor al gekookt? Sla deze stap dan over. Schep anders de warme rijst op een groot bord en spreid hem uit. Laat hem afkoelen terwijl je de tempeh bakt. Rijst die je niet meteen gebruikt zet je binnen 1 uur in de koelkast.","Groot bord"],["Bak de tempeh: zet een wok op middelhoog vuur en verhit de helft van de olie. Bak de tempeh 6 minuten en draai hem af en toe om, tot hij goudbruin en krokant is. Leg hem op een bord.","Wok, spatel, bord"],["Bak de groenten: doe de rest van de olie in dezelfde wok. Bak de sjalot, knoflook, peper, wortel en bonen 4 minuten. Roer steeds, want knoflook wordt bitter als hij verbrandt.","Wok, spatel"],["Bak de rijst: doe de tempeh terug in de wok en voeg de rijst toe. Zet het vuur hoog en schenk de ketjap manis erbij. Bak 5 minuten en roer de hele tijd, tot alle rijst bruin en heet is. Zet het vuur laag en leg een deksel of bord op de wok.","Wok, spatel, deksel of bord"],["Bak de eieren en serveer: verhit in een kleine koekenpan een beetje olie en bak de eieren als spiegelei tot het wit stevig is. Schep de rijst op borden, leg een ei erop en strooi de gebakken uitjes erover. Snijd de komkommer en tomaat in plakjes en leg ze ernaast.","Kleine koekenpan, mes, borden"]],
tip:"Weinig pit? Laat de peper weg. Controleer bij sambal het etiket, want sommige merken bevatten garnalenpasta."}

ing:[["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"],["Tofu (stevig)",400,"g","s"],["Champignons",200,"g","s"],["Ketjap manis voor de marinade",3,"el","t"],["Ketoembar (gemalen koriander)",1,"tl","t"],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Zonnebloemolie",2,"el","s"],["Satéstokjes",12,"stuk|stuks","s"],["Pindakaas (puur)",100,"g","s"],["Water voor de saus",150,"ml"],["Ketjap manis voor de saus",1,"el","t"],["Sambal oelek",1,"tl","t"],["Limoen",1,"stuk|stuks","s",[1,"el","limoensap uit een flesje"]]],
st:[["Week de stokjes en pers de tofu: doe dit als eerste. Leg de satéstokjes 20 minuten in een bak met water. Haal de tofu uit de verpakking, wikkel hem in keukenpapier en leg er een zware plank of pan op. Laat 15 minuten staan, dan gaat het vocht eruit en wordt de tofu stevig.","Bak of kom, keukenpapier, zware plank of pan"],["Maak de marinade: schil de gember en de knoflook en hak ze fijn. Doe ze in een mengkom met de ketjap, de ketoembar en de olie en roer goed.","Mengkom, mes, snijplank"],["Snijd de tofu en de champignons: snijd de tofu in blokken van 2,5 cm. Veeg de champignons schoon met keukenpapier en haal het steeltje er af. Halveer grote champignons. Roer ze voorzichtig door de marinade, dek de kom af met een bord of folie en zet hem 20 minuten in de koelkast.","Snijplank, mes, mengkom, bord of folie"],RW,RK,["Maak de pindasaus: doe dit terwijl de rijst kookt. Doe de pindakaas, het water, de ketjap, de sambal en het sap van de limoen in een steelpan. Verwarm op laag vuur en roer tot de saus glad is, ongeveer 5 minuten. Zet het vuur zo laag mogelijk om de saus warm te houden.","Steelpan, houten lepel, citruspers of mes"],["Rijg de spiesjes: haal de stokjes uit het water. Prik om en om tofu en champignon aan elk stokje.","Satéstokjes"],["Bak de spiesjes: verhit een grillpan op middelhoog vuur. Bak de spiesjes 10 minuten en draai ze voorzichtig om, tot de tofu aan alle kanten goudbruin is.","Grillpan, tang of vork"],["Serveer: de rijst is nu klaar en nog warm onder het deksel. Schep de rijst op borden, leg de spiesjes erbij en schenk de saus erover of zet hem apart.","Borden"]],
tip:"Pers de tofu goed uit. Dan wordt hij krokant en valt hij minder snel van het stokje."}

ing:[["Kipdijfilet",400,"g","s"],["Water",1200,"ml"],["Citroengras",2,"stengel|stengels","t",[1,"tl","citroengraspoeder"]],["Verse kurkuma",2,"cm","t",[1,"tl","kurkumapoeder"]],["Verse gember",3,"cm","s",[1,"tl","gemberpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Sjalotten",2,"stuk|stuks","s",[2,"tl","uienpoeder"]],["Zout",1,"tl"],["Zonnebloemolie",2,"el","s"],["Soun (glasnoedels)",100,"g","t"],["Taugé",100,"g","s"],["Eieren",4,"stuk|stuks","s"],["Lente-ui",2,"stuk|stuks","s"],["Gebakken uitjes",2,"el","t"],["Limoen",1,"stuk|stuks","s"]],
st:[["Snijd de kruiden: schil de sjalotten, knoflook, gember en kurkuma en hak ze fijn. Sla het citroengras plat met de achterkant van een mes, zodat de smaak vrijkomt. Snijd de lente-ui in ringen. Kurkuma kleurt je vingers en snijplank geel.","Snijplank, mes"],KV,["Maak de bouillon: verhit de olie in een grote pan op middelhoog vuur. Bak de sjalot, knoflook, gember en kurkuma 2 minuten. Voeg de kip en het citroengras toe en bak nog 2 minuten. Schenk het water erbij, doe het zout erbij en breng aan de kook. Zet het vuur laag en laat 20 minuten zachtjes koken met het deksel half op de pan.","Grote pan, houten lepel"],["Kook de eieren: doe dit terwijl de bouillon pruttelt. Kook de eieren 8 minuten in een pan met water, spoel ze koud af, pel ze en snijd ze doormidden.","Kleine pan, lepel, mes"],["Week de soun: leg de soun in een kom en giet er kokend water over. Laat 5 minuten staan en giet af.","Kom, vergiet"],["Haal de kip eruit: schep de kip met een schuimspaan uit de bouillon en trek hem met twee vorken in draadjes. Haal het citroengras uit de bouillon. Proef de bouillon en voeg zout of limoensap toe als dat nodig is.","Schuimspaan, twee vorken, bord"],["Serveer: verdeel de soun, de taugé, de kip en de eieren over soepkommen. Schenk de hete bouillon erover. Strooi de lente-ui en de gebakken uitjes erover en zet limoenpartjes en sambal op tafel.","Soepkommen, soeplepel"]],
tip:"De soep smaakt de volgende dag nog beter. Bewaar de bouillon apart van de noedels."}

st:[["Snijd de kruiden: schil de sjalotten, knoflook, gember en kurkuma en hak ze fijn. Sla het citroengras plat met de achterkant van een mes. Snijd de lente-ui in ringen.","Snijplank, mes"],["Maak de tofu en champignons klaar: dep de tofu droog met keukenpapier en snijd hem in blokjes van 2 cm. Veeg de champignons schoon met keukenpapier en snijd ze in plakjes.","Keukenpapier, snijplank, mes"],["Maak de bouillon: verhit de olie in een grote pan op middelhoog vuur. Bak de sjalot, knoflook, gember en kurkuma 2 minuten. Voeg de tofu en de champignons toe en bak 4 minuten. Schenk het water erbij, voeg de bouillonblokjes en het citroengras toe en breng aan de kook. Laat 15 minuten zachtjes koken.","Grote pan, houten lepel"],["Kook de eieren: doe dit terwijl de bouillon pruttelt. Kook de eieren 8 minuten, spoel ze koud af, pel ze en snijd ze doormidden.","Kleine pan, lepel, mes"],["Week de soun: leg de soun in een kom en giet er kokend water over. Laat 5 minuten staan en giet af. Haal het citroengras uit de bouillon en proef of er zout of limoensap bij moet.","Kom, vergiet"],["Serveer: verdeel de soun, de taugé en de eieren over soepkommen. Schenk de hete bouillon met tofu en champignons erover. Strooi de lente-ui en de gebakken uitjes erover en zet limoenpartjes en sambal op tafel.","Soepkommen, soeplepel"]],
tip:"Controleer het etiket van de bouillonblokjes: sommige bevatten toch vleesextract."}

ing:[["Rundvlees (stoofvlees)",800,"g","s"],["Kokosmelk",400,"ml","s"],["Water",300,"ml"],["Sjalotten",4,"stuk|stuks","s",[4,"tl","uienpoeder"]],["Knoflook",4,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse gember",3,"cm","s",[1,"tl","gemberpoeder"]],["Verse kurkuma",2,"cm","t",[1,"tl","kurkumapoeder"]],["Verse rode peper",2,"stuk|stuks","s",[2,"tl","sambal oelek"]],["Citroengras",2,"stengel|stengels","t",[1,"tl","citroengraspoeder"]],["Ketoembar (gemalen koriander)",1,"tl","t"],["Bruine suiker",1,"el","s"],["Zout",1,"tl"],["Zonnebloemolie",2,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[["Maak het vlees klaar: dep het vlees droog met keukenpapier. Snijd te veel vet en harde peesjes weg. Snijd het vlees in blokken van 4 cm. Maak daarna je handen, het mes en de plank schoon met heet water en afwasmiddel.","Keukenpapier, snijplank, scherp mes"],["Maak de kruidenpasta: schil de sjalotten, de knoflook, de gember en de kurkuma. Haal de zaadjes uit de peper. Doe alles met een scheut water in een beker en maal het fijn met de staafmixer. Sla het citroengras plat met de achterkant van een mes.","Staafmixer of keukenmachine, mes"],["Bak de pasta: verhit de olie in een grote braadpan op middelhoog vuur. Bak de kruidenpasta 4 minuten en roer vaak. Voeg het citroengras en de ketoembar toe.","Braadpan, houten lepel"],["Bak het vlees: doe het vlees in de pan en roer 5 minuten, tot het van alle kanten dichtgeschroeid is.","Braadpan, houten lepel"],["Laat het stoven: schenk de kokosmelk en het water erbij. Voeg de suiker en het zout toe. Breng aan de kook, zet het vuur laag en leg het deksel half op de pan. Laat 1,5 uur zachtjes koken en roer elke 20 minuten, zodat er niets aanbrandt.","Braadpan met deksel, houten lepel"],RW,RK,["Laat de saus inkoken: haal het deksel van de pan en laat nog 45 tot 60 minuten koken, tot de saus donkerbruin en bijna droog is. Roer in deze tijd vaker, anders brandt hij aan. Het vlees is klaar als het uit elkaar valt met een vork. Haal het citroengras eruit.","Braadpan, houten lepel, vork"],["Serveer: schep de rijst op borden en leg de rendang ernaast.","Borden"]],
tip:"Rendang kun je een dag eerder maken. Warm hem op met een scheutje water."}

st:[["Maak het vlees klaar: dep het vlees droog met keukenpapier. Snijd het vet en de peesjes weg. Snijd het vlees in blokjes van 3 cm. Maak daarna je handen, het mes en de plank schoon met heet water en afwasmiddel.","Keukenpapier, snijplank, scherp mes"],["Snijd de rest: schil de sjalotten en snijd ze in halve ringen. Hak de knoflook, de gember en de peper fijn. Snijd de lente-ui in ringen.","Snijplank, mes"],RW,RK,["Bak het vlees: verhit de helft van de olie in een grote koekenpan op hoog vuur. Bak het vlees in twee rondes 4 minuten per ronde, tot het bruin is. Leg het vlees op een bord.","Koekenpan, houten lepel, bord"],["Bak de aroma’s: doe de rest van de olie in de pan en zet het vuur middelhoog. Bak de sjalot, knoflook, gember en peper 2 minuten.","Koekenpan, houten lepel"],["Laat het stoven: doe het vlees terug in de pan en schenk de ketjap manis, de sojasaus en het water erbij. Leg het deksel half op de pan en laat 20 minuten zachtjes koken. Roer af en toe. Het vlees is klaar als er geen roze meer te zien is en de saus glanst en dik is.","Koekenpan met deksel, houten lepel"],["Serveer: schep de rijst op borden, leg het vlees erbij en strooi de lente-ui erover.","Borden"]],
tip:"Neem varkensschouder voor een zachter resultaat. Stoof dan 15 minuten langer."}

ing:[["Visfilet",600,"g","s"],["Kurkumapoeder",1,"tl","s"],["Zout voor de vis",1,"tl"],["Limoensap voor de vis",1,"el","s"],["Maizena",3,"el","s"],["Zonnebloemolie",5,"el","s"],["Tomaten",2,"stuk|stuks","s"],["Sjalotten",2,"stuk|stuks","s",[2,"tl","uienpoeder"]],["Knoflook",2,"teen|tenen","s",[0.5,"tl","knoflookpoeder"]],["Verse rode peper",2,"stuk|stuks","s",[2,"tl","sambal oelek"]],["Limoen",1,"stuk|stuks","s",[1,"el","limoensap uit een flesje"]],["Suiker",1,"tl","s"],["Komkommer",1,"stuk|stuks","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[RW,RK,["Maak de vis klaar: dep de vis droog met keukenpapier. Voel met je vinger of er nog graten in zitten en trek ze eruit. Snijd de vis in stukken van 150 g. Wrijf de vis in met de kurkuma, het zout en het limoensap en laat hem 10 minuten staan. Was daarna je handen en de plank met heet water en afwasmiddel.","Keukenpapier, snijplank, mes"],["Maak de sambal: snijd de tomaten, de sjalotten en de knoflook fijn. Haal de zaadjes uit de peper en snijd hem fijn. Verhit 1 el olie in een steelpan en bak alles 6 minuten op middelhoog vuur tot het zacht is. Roer het sap van de limoen en de suiker erdoor. Prak het geheel met de achterkant van een lepel.","Snijplank, mes, steelpan, houten lepel"],["Bak de vis: doe de maizena in een diep bord en wentel de vis erdoor. Verhit de rest van de olie in een koekenpan op middelhoog vuur. Bak de vis 4 minuten per kant, tot hij goudbruin is en makkelijk uit elkaar valt. Draai de vis maar één keer om.","Diep bord, koekenpan, visspatel"],["Serveer: schep de rijst op borden, leg de vis erbij en schep de sambal erover. Snijd de komkommer in plakjes en leg ze ernaast.","Borden, mes"]],
tip:"Bak de vis als laatste. Rijst en sambal blijven warm onder het deksel."}

st:[["Snijd de groenten: snijd de courgette in halve plakjes. Knip de uiteinden van de bonen af en halveer de bonen. Pluk de basilicumblaadjes van de stelen. Snijd de limoen doormidden.","Snijplank, mes"],KV,RW,RK,["Bak de pasta: verhit de olie in een wok op middelhoog vuur. Bak de currypasta 1 minuut en roer. Doe de kip erbij en bak 3 minuten.","Wok, houten lepel"],["Maak de curry: schenk de kokosmelk en het water erbij en breng aan de kook. Zet het vuur laag en laat 10 minuten zachtjes koken. Voeg de courgette en bonen toe en laat nog 5 minuten koken.","Wok, houten lepel"],["Maak de smaak af: roer de vissaus en de suiker erdoor. Knijp er een half limoen in en proef. Meer vissaus maakt het zouter, meer limoen zuurder. Roer de basilicum erdoor.","Houten lepel"],["Serveer: schep de rijst op borden en schep de curry erbij. Zet een partje limoen op het bord.","Borden"]],

,{id:"kroepoek",naam:"Kroepoek bakken",keuken:"Indonesisch",bij:true,veg:true,c:"#F5B820",tijd:10,kcal:150,niv:"Makkelijk",
intro:"Rauwe kroepoek bak je in een paar seconden in hete olie, dan zwelt hij op tot een knapperige chip.",
all:["Geen van de bekende hoofdallergenen. Controleer wel de etiketten."],

ing:[["Rauwe kroepoek (zonder garnaal)",100,"g","t"],["Zonnebloemolie",400,"ml","s"]],
st:[["Verhit de olie: giet de olie in een diepe pan of wok. De olie moet minstens 3 cm hoog staan. Verhit hem op middelhoog vuur. Laat de pan nooit alleen en blus een oliebrand nooit met water. Leg een deksel op de pan als de olie vlam vat.","Diepe pan of wok"],["Test de olie: laat één stukje kroepoek in de olie vallen. Zwelt het meteen op en komt het naar boven? Dan is de olie heet genoeg.","Diepe pan"],["Bak de kroepoek: bak steeds een paar stukjes tegelijk. Ze zijn na 2 tot 3 seconden opgezwollen en wit. Haal ze er meteen uit, anders worden ze bruin.","Diepe pan, schuimspaan"],["Laat uitlekken: leg de kroepoek op een schaal met keukenpapier. Laat afkoelen en serveer.","Grote schaal, keukenpapier"]],
tip:"Bewaar gebakken kroepoek in een luchtdichte trommel. Dan blijft hij een week knapperig."}

st:[["Snijd de groenten: snijd de komkommer en de wortel in dunne staafjes. Snijd de sjalot in dunne ringen. Haal de zaadjes uit de peper en snijd hem in dunne ringetjes. Doe alles in een schaal of pot.","Snijplank, mes, schaal of pot"],["Maak de marinade: doe de azijn, het water, de suiker, het zout en de kurkuma in een steelpan. Breng aan de kook en laat 2 minuten koken, tot de suiker is opgelost.","Steelpan"],["Laat trekken: giet de hete marinade over de groenten. Laat afkoelen en zet de atjar minstens 30 minuten in de koelkast.","Pot met deksel"]],
tip:"In een gesloten pot in de koelkast blijft atjar een week goed."}

,{id:"semur-daging",naam:"Semur daging",keuken:"Indonesisch",c:"#D33F1F",tijd:130,kcal:480,niv:"Makkelijk",

all:["Geen van de bekende hoofdallergenen."],
gerei:["Zeef","Pan met deksel of rijstkoker","Vork","Gootsteen","Keukenpapier","Snijplank","Mes","Brede pan met deksel","Tang","Koekenpan","Borden"],
ing:[["Kippendij (met bot)",800,"g","s"],["Water",300,"ml"],["Sjalotten",3,"stuk|stuks","s",[3,"tl","uienpoeder"]],["Knoflook",4,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse kurkuma",2,"cm","t",[1,"tl","kurkumapoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Ketoembar (gemalen koriander)",1,"tl","t"],["Zout",2,"tl"],["Zonnebloemolie",6,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[["Maak de kip klaar: haal de kip uit de verpakking en verwijder eventuele losse stukjes en ongewenste delen. Wil je de kip toch afspoelen, doe dit dan zo voorzichtig mogelijk en voorkom spatten. Maak daarna de gootsteen en de directe omgeving grondig schoon. Was ook je handen goed. Zorg er tijdens het bereiden voor dat de kip goed door en door wordt verhit. Rauwe of onvoldoende verhitte kip kan schadelijke bacteriën bevatten en voedselvergiftiging veroorzaken.","Gootsteen, keukenpapier, aparte snijplank, scherp mes"],["Maak de kruidenpasta: schil de sjalotten, knoflook, gember en kurkuma en hak ze fijn. Meng ze met het zout en de ketoembar.","Snijplank, mes"],["Kook de kip gaar: doe de kip, de kruidenpasta en het water in een brede pan. Breng aan de kook, zet het vuur laag en leg het deksel erop. Laat 25 minuten zachtjes koken en draai de kip halverwege om. Haal de kip met een tang uit de pan en laat hem 5 minuten uitlekken op keukenpapier.","Brede pan met deksel, tang, keukenpapier"],RW,RK,["Bak de kip krokant: verhit de olie in een koekenpan op middelhoog vuur. Bak de kip 3 tot 4 minuten per kant, tot de huid goudbruin is. Pas op voor spattende olie. Dep de kip altijd eerst droog.","Koekenpan, tang"],["Serveer: schep de rijst op borden en leg de kip erbij. Gebruik eventueel de kooklijk als saus.","Borden"]],
tip:"De kip is gaar als er geen roze meer te zien is. Snijd hem bij de bot open om te controleren."}

st:[KV,["Maak de kruiden klaar: schil de sjalotten, de knoflook en de gember en hak ze fijn. Sla het citroengras plat met de achterkant van een mes.","Snijplank, mes"],RW,RK,["Bak de kruiden: verhit de olie in een grote pan op middelhoog vuur. Bak de sjalot, knoflook, gember, ketoembar en nootmuskaat 2 minuten. Doe de kip en het citroengras erbij en bak 3 minuten.","Grote pan, houten lepel"],["Laat de kip garen: schenk de kokosmelk en het water erbij. Voeg de suiker en het zout toe. Breng aan de kook, zet het vuur laag en laat 20 minuten zachtjes koken met het deksel half op de pan. Roer af en toe. Haal het citroengras eruit.","Grote pan met deksel, houten lepel"],["Serveer: schep de rijst op borden en leg de kip met saus erbij.","Borden"]],

ing:[["Kipdijfilet",600,"g","s"],["Kokosmelk",400,"ml","s"],["Water",200,"ml"],["Aardappelen",300,"g","s"],["Sjalotten",3,"stuk|stuks","s",[3,"tl","uienpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Kerriepoeder",2,"el","s"],["Citroengras",1,"stengel|stengels","t",[0.5,"tl","citroengraspoeder"]],["Tomaten",1,"stuk|stuks","s"],["Zout",1,"tl"],["Zonnebloemolie",2,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[KV,["Snijd de groenten: schil de aardappelen en snijd ze in stukken van 3 cm. Schil de sjalotten, de knoflook en de gember en hak ze fijn. Snijd de tomaat in stukjes. Sla het citroengras plat.","Snijplank, mes, schilmesje"],RW,RK,["Bak de kruiden: verhit de olie in een grote pan op middelhoog vuur. Bak de sjalot, knoflook en gember 2 minuten. Voeg de kerriepoeder toe en bak 1 minuut. Doe de kip, de tomaat en het citroengras erbij en bak 3 minuten.","Grote pan, houten lepel"],["Laat de kerrie garen: schenk de kokosmelk en het water erbij, voeg het zout en de aardappel toe. Leg het deksel half op de pan en laat 25 minuten zachtjes koken. Haal het citroengras eruit en serveer op de rijst.","Grote pan met deksel, borden"]],
tip:"Kerriepoeder verbrandt snel. Bak het maximaal 1 minuut."}

st:[KV,["Maak de kruiden klaar: haal de zaadjes uit de peper voor minder pit en snijd de peper, sjalot, knoflook en tomaat fijn. Sla het citroengras plat. Was daarna je handen goed.","Snijplank, mes"],RW,RK,["Bak de kruiden: verhit de olie in een wok op middelhoog vuur. Bak de peper, sjalot, knoflook en het citroengras 4 minuten. Voeg de tomaat toe en bak 3 minuten.","Wok, houten lepel"],["Bak de kip: doe de kip, de suiker en het zout in de wok. Bak 12 minuten op middelhoog vuur tot de kip gaar is en de saus dik. Roer vaak. Knijp de limoen erover en haal het citroengras eruit.","Wok, houten lepel"],["Serveer: schep de rijst op borden en leg de kip erbij.","Borden"]],

ing:[["Kipdijfilet",600,"g","s"],["Water voor de bouillon",1000,"ml"],["Verse gember",5,"cm","s",[2,"tl","gemberpoeder"]],["Lente-ui",3,"stuk|stuks","s"],["Zout",1,"tl"],["Knoflook",2,"teen|tenen","s",[0.5,"tl","knoflookpoeder"]],["Jasmijnrijst (ongekookt)",280,"g","s"],["Bouillon voor de rijst",420,"ml"],["Zonnebloemolie",1,"el","s"],["Sojasaus",2,"el","s"],["Sesamolie",1,"tl","t"],["Komkommer",1,"stuk|stuks","s"]],
st:[KV,["Maak de bouillon: snijd de helft van de gember in plakjes en de lente-ui in stukken van 5 cm. Breng het water in een grote pan aan de kook met de gember, de lente-ui en het zout.","Snijplank, mes, grote pan"],["Gaar de kip: leg de kip in de pan. Zet het vuur laag en leg het deksel erop. Laat 15 minuten zachtjes koken, niet hard. Haal de kip met een schuimspaan uit de pan en laat hem afkoelen. Hou de bouillon.","Grote pan met deksel, schuimspaan"],RW,["Kook de rijst in bouillon: hak de knoflook en de rest van de gember fijn en bak ze 1 minuut in de olie in een pan. Voeg de rijst toe en bak 1 minuut. Meet de bouillon af, schenk hem erbij en breng aan de kook. Zet het vuur laag en leg het deksel op de pan. Laat 12 minuten koken en daarna 10 minuten dichtgedekt staan. Heb je een rijstkoker? Doe de rijst, de gebakken knoflook en de bouillon dan in de rijstkoker.","Pan met deksel of rijstkoker"],["Maak de dipsaus: meng de sojasaus en de sesamolie in een kleine kom. Snijd de komkommer in plakjes.","Kleine kom, snijplank, mes"],["Serveer: snijd de kip in plakjes. Schep de rijst op borden, leg de kip en komkommer erbij en schenk de dipsaus erover. Serveer een kopje bouillon erbij.","Borden, mes"]],
tip:"De kip is gaar als er geen roze meer te zien is en het sap helder is."}

st:[KV,RW,RK,["Bereid de kip voor: snijd de kip in blokjes van 2 cm. Meng ze in een kom met de sojasaus en 2 el maizena, tot elk stukje bedekt is.","Mengkom"],["Snijd de groenten: snijd de paprika en de ui in stukken van 2 cm. Laat de ananas uitlekken en bewaar 3 el sap.","Snijplank, mes"],["Maak de saus: meng de ketchup, azijn, suiker en het ananassap met 1 el maizena in een kleine kom.","Kleine kom"],["Bak de kip: verhit de olie in een wok op middelhoog vuur. Bak de kip in twee rondes 5 minuten tot hij goudbruin en krokant is. Leg hem op een bord.","Wok, spatel, bord"],["Maak de saus af: bak de paprika en ui 3 minuten in de wok. Schenk de saus erbij en kook 1 minuut tot hij dik wordt. Doe de kip en de ananas erbij en roer 1 minuut. Serveer op de rijst.","Wok, spatel, borden"]],
tip:"Eet de kip snel op. Door de saus wordt de korst zacht."}

st:[KV,["Maak de marinade: haal de buitenste laag van het citroengras en snijd de binnenkant heel fijn. Hak de knoflook, sjalot en peper fijn. Meng alles in een kom met de vissaus en de suiker en roer de kip erdoor. Laat 20 minuten in de koelkast staan.","Snijplank, mes, mengkom"],RW,RK,["Bak de kip: verhit de olie in een wok op hoog vuur. Bak de kip in twee rondes 6 minuten, tot hij goudbruin en niet meer roze is.","Wok, spatel"],["Serveer: knijp het sap van de limoen over de kip. Schep de rijst op borden en leg de kip erbij.","Borden"]],

st:[["Kook de aardappelen voor: schil de aardappelen en snijd ze in partjes van 3 cm. Kook ze 8 minuten in water en giet ze af.","Schilmesje, pan, vergiet"],MV("in plakken van 1 cm tegen de draad in"),["Bak de aardappelen: verhit de helft van de olie in een koekenpan op middelhoog vuur. Bak de aardappelen 10 minuten tot ze goudbruin zijn en houd ze warm.","Koekenpan, spatel"],["Bak het vlees: strooi de peper over het vlees. Verhit de rest van de olie in een tweede koekenpan op hoog vuur. Bak het vlees 2 minuten per kant. Leg het op een bord.","Koekenpan, spatel, bord"],["Maak de saus: snijd de uien in halve ringen en hak de knoflook fijn. Bak ze 4 minuten in dezelfde pan. Schenk de ketjap, de sojasaus en het water erbij en kook 3 minuten. Leg het vlees 1 minuut terug in de saus.","Koekenpan, spatel"],["Serveer: schep de aardappelen en het vlees op borden en schenk de saus erover.","Borden"]],
tip:"Bak het vlees kort op hoog vuur, dan blijft het sappig."}

st:[["Week de stokjes: doe dit als eerste. Leg de satéstokjes 20 minuten in een bak met water.","Bak of kom"],MV("in blokjes van 2,5 cm"),["Maak de marinade: hak de knoflook en de gember fijn en meng ze in een kom met de ketjap, de ketoembar en de olie. Roer het vlees erdoor, dek af met een bord of folie en laat 20 minuten in de koelkast staan.","Mengkom, bord of folie"],RW,RK,["Maak de pindasaus: doe de pindakaas, het water, de ketjap, de sambal en het limoensap in een steelpan. Verwarm op laag vuur en roer tot de saus glad is, ongeveer 5 minuten. Houd hem warm op laagste vuur.","Steelpan, houten lepel"],["Rijg de spiesjes: haal de stokjes uit het water en prik 4 stukjes vlees aan elk stokje. Was daarna je handen met zeep.","Satéstokjes"],["Bak de spiesjes: verhit een grillpan op middelhoog vuur. Bak de spiesjes 10 tot 12 minuten en draai ze vaak. Snijd een stukje door: het vlees moet niet meer roze zijn.","Grillpan, tang"],["Serveer: schep de rijst op borden, leg de spiesjes erbij en schenk de saus erover.","Borden"]],

ing:[["Varkenshaas",600,"g","s"],["Sojasaus",3,"el","s"],["Honing",3,"el","s"],["Hoisinsaus",2,"el","t"],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Vijfkruidenpoeder",1,"tl","t"],["Komkommer",1,"stuk|stuks","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[MV("in 2 lange stukken van ongeveer 5 cm dik"),["Maak de marinade: hak de knoflook en de gember fijn. Meng ze in een kom met de sojasaus, 2 el honing, de hoisinsaus en de vijfkruidenpoeder. Draai het vlees door de marinade, dek af en laat 30 minuten in de koelkast staan. Bewaar 1 el honing voor later.","Mengkom, bord of folie"],["Verwarm de oven voor: zet de oven op 200 °C.","Oven"],RW,RK,["Rooster het vlees: leg het vlees op een rooster boven een bakplaat met bakpapier. Rooster 25 tot 30 minuten en draai het vlees halverwege om. Het vlees is gaar als er geen roze meer te zien is. Gooi de rest van de marinade weg.","Rooster, bakplaat, bakpapier"],["Maak glanzend: meng de laatste honing met 1 el warm water en bestrijk het vlees. Laat het vlees 5 minuten rusten onder folie en snijd het dan in plakjes.","Kwast of lepel, snijplank, mes"],["Serveer: snijd de komkommer in plakjes. Schep de rijst op borden en leg het vlees en de komkommer erbij.","Borden"]],

st:[RW,RK,["Snijd de groenten: knip de uiteinden van de bonen af en snijd de bonen in stukken van 3 cm. Snijd de sjalot, knoflook en tomaat fijn.","Snijplank, mes"],["Bak het gehakt: verhit de olie in een koekenpan op hoog vuur. Bak het gehakt 6 minuten en maak het los met de lepel, tot het bruin is en niet meer roze. Giet overtollig vet af. Was daarna je handen.","Koekenpan, houten lepel"],["Bak de aroma’s: zet het vuur middelhoog en bak de sjalot, knoflook en tomaat 3 minuten mee.","Koekenpan, houten lepel"],["Stoof de bonen: doe de bonen, de ketjap, de sambal en het water erbij. Leg het deksel op de pan en laat 8 minuten koken tot de bonen zacht zijn. Serveer op de rijst.","Koekenpan met deksel, borden"]],

st:[["Maak het gehakt klaar: hak de knoflook fijn. Meng het gehakt in een kom met de maizena, het ei, de knoflook, het zout en de peper. Kneed 2 minuten met je handen tot een stevige massa. Was daarna je handen met zeep.","Mengkom, mes"],["Vorm de balletjes: maak je handen nat en rol 16 balletjes van 3 cm. Leg ze op een bord.","Bord"],["Maak de bouillon: breng het water met de bouillonblokjes aan de kook in een grote pan.","Grote pan"],["Kook de balletjes: laat de balletjes voorzichtig in de bouillon zakken en kook ze 10 minuten zachtjes. Ze zijn gaar als ze bovenop drijven en binnenin niet meer roze zijn.","Grote pan, schuimspaan"],["Week de soun: leg de soun in een kom en giet er kokend water over. Laat 5 minuten staan en giet af. Snijd de lente-ui in ringen.","Kom, vergiet, mes"],["Serveer: verdeel de soun, de taugé en de balletjes over soepkommen. Schenk de hete bouillon erover. Strooi de lente-ui en gebakken uitjes erover en serveer met ketjap manis, sambal en limoen.","Soepkommen"]],
tip:"Bakso kun je invriezen, kook ze dan zonder de bouillon."}

ing:[["Garnalen (gepeld, ontdooid)",400,"g","s"],["Water",1000,"ml"],["Citroengras",2,"stengel|stengels","t",[1,"tl","citroengraspoeder"]],["Verse gember",3,"cm","s",[1,"tl","gemberpoeder"]],["Champignons",200,"g","s"],["Tomaten",2,"stuk|stuks","s"],["Verse rode peper",2,"stuk|stuks","s",[2,"tl","sambal oelek"]],["Vissaus",2,"el","t"],["Limoen",2,"stuk|stuks","s",[3,"el","limoensap uit een flesje"]],["Suiker",1,"tl","s"],["Verse koriander",10,"g","s"]],
st:[["Maak de garnalen droog: spoel de garnalen af in een vergiet en dep ze droog met keukenpapier.","Vergiet, keukenpapier"],["Snijd alles: sla het citroengras plat en snijd het in stukken. Snijd de gember in plakjes, de champignons in plakjes, de tomaten in partjes en de peper in ringetjes. Pers de limoenen uit.","Snijplank, mes"],["Maak de bouillon: breng het water met het citroengras, de gember en de peper aan de kook in een grote pan. Laat 8 minuten zachtjes koken.","Grote pan"],["Voeg de groenten toe: doe de champignons en de tomaat in de pan en kook 4 minuten.","Grote pan, houten lepel"],["Gaar de garnalen: voeg de garnalen toe en kook 2 tot 3 minuten tot ze roze zijn. Kook ze niet langer, anders worden ze taai.","Grote pan"],["Maak af: roer de vissaus, de suiker en het limoensap erdoor. Serveer met koriander. Het citroengras en de gember eet je niet mee.","Soepkommen"]],

st:[["Snijd de groenten: schil de wortels en snijd ze in plakjes. Snijd de courgette in halve plakjes en de tomaat in partjes. Snijd de sjalot en knoflook fijn. Laat de mais uitlekken en spoel de spinazie af.","Snijplank, mes"],["Bak de sjalot en knoflook: verhit de olie in een grote pan en bak de sjalot en knoflook 1 minuut.","Grote pan, houten lepel"],["Kook de soep: schenk het water erbij en breng aan de kook. Doe de wortel erin en kook 8 minuten. Voeg de courgette, de mais en de tomaat toe en kook 4 minuten.","Grote pan"],["Maak af: voeg de spinazie toe en kook 1 minuut. Roer het zout en de suiker erdoor, proef en serveer.","Soepkommen"]],

,{id:"bami-goreng-kip",naam:"Bami goreng met kip",keuken:"Indonesisch",c:"#D33F1F",tijd:35,kcal:560,niv:"Makkelijk",

gerei:["Grote pan","Vergiet","Snijplank","Scherp mes","Gootsteen","Keukenpapier","Kleine kom","Wok","Spatel","Borden"],
ing:[["Bamischijven (droog)",250,"g","t"],["Kipdijfilet",300,"g","s"],["Prei",1,"stuk|stuks","s"],["Ui",1,"stuk|stuks","s",[1,"tl","uienpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Spitskool",150,"g","s"],["Ketjap manis",4,"el","t"],["Sojasaus",1,"el","s"],["Sambal oelek",1,"tl","t"],["Eieren",2,"stuk|stuks","s"],["Zonnebloemolie",3,"el","s"],["Gebakken uitjes",2,"el","t"]],
st:[["Snijd de groenten: snijd de prei in dunne ringen, de ui in halve ringen en de kool in dunne reepjes. Hak de knoflook fijn. Spoel de prei goed af, want er zit vaak zand tussen.","Snijplank, mes"],KV,["Maak de saus: roer de ketjap manis, de sojasaus en de sambal door elkaar in een kleine kom.","Kleine kom, lepel"],["Kook de bami: kook de bamischijven in een grote pan met water volgens de verpakking, meestal 3 tot 4 minuten. Giet ze af, spoel ze koud af en meng er een beetje olie door.","Grote pan, vergiet"],["Bak de kip: verhit de helft van de olie in een wok op middelhoog vuur. Bak de kip 5 tot 6 minuten tot hij goudbruin is en niet meer roze. Leg hem op een bord.","Wok, spatel, bord"],["Bak de groenten: doe de rest van de olie in de wok. Bak de ui en knoflook 1 minuut. Voeg de prei en de kool toe en bak 4 minuten. Schuif alles opzij, breek 1 ei in de wok en roer tot het gestold is.","Wok, spatel"],["Bak de bami: doe de bami, het eiwit en de saus in de wok en zet het vuur hoog. Bak 3 minuten en roer steeds. Is de bami te droog? Voeg een scheutje water toe.","Wok, spatel"],["Serveer: schep de bami op borden en strooi de gebakken uitjes erover. Bak het andere ei als spiegelei in een koekenpan en leg het erbovenop.","Koekenpan, borden"]],
tip:"Bak de bami niet te lang, anders wordt hij droog."}

ing:[["Biefstuk (of ossenhaas)",600,"g","s"],["Ketjap manis voor de marinade",3,"el","t"],["Ketoembar (gemalen koriander)",1,"tl","t"],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Zonnebloemolie",2,"el","s"],["Satéstokjes",12,"stuk|stuks","s"],["Pindakaas (puur)",100,"g","s"],["Water voor de saus",150,"ml"],["Ketjap manis voor de saus",1,"el","t"],["Sambal oelek",1,"tl","t"],["Limoen",1,"stuk|stuks","s",[1,"el","limoensap uit een flesje"]],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[["Week de stokjes: doe dit als eerste. Leg de satéstokjes 20 minuten in een bak met water.","Bak of kom"],MV("in blokjes van 2,5 cm"),["Maak de marinade: hak de knoflook en de gember fijn en meng ze in een kom met de ketjap, de ketoembar en de olie. Roer het vlees erdoor, dek af met een bord of folie en laat 20 minuten in de koelkast staan.","Mengkom, bord of folie"],RW,RK,["Maak de pindasaus: doe de pindakaas, het water, de ketjap, de sambal en het limoensap in een steelpan. Verwarm op laag vuur en roer tot de saus glad is, ongeveer 5 minuten. Houd hem warm op laagste vuur.","Steelpan, houten lepel"],["Rijg de spiesjes: haal de stokjes uit het water en prik 4 stukjes vlees aan elk stokje. Was daarna je handen met zeep.","Satéstokjes"],["Bak de spiesjes: verhit een grillpan op middelhoog vuur. Bak de spiesjes 10 tot 12 minuten en draai ze vaak. Snijd een stukje door: het vlees is bruin en gaar.","Grillpan, tang"],["Serveer: schep de rijst op borden, leg de spiesjes erbij en schenk de saus erover.","Borden"]],
tip:"Bak niet te lang, anders wordt het rundvlees taai."}

st:[MV("in 4 grote stukken van 5 cm"),["Maak de kruiden klaar: schil de knoflook, sjalotten en gember en hak ze fijn. Sla het citroengras plat.","Snijplank, mes"],["Kook het vlees: doe het vlees, het water, de kruiden, de ketoembar, de ketjap, de suiker en het zout in een grote pan. Breng aan de kook, zet het vuur laag en leg het deksel erop. Laat 90 minuten zachtjes koken, tot het vlees zacht is.","Grote pan met deksel"],RW,RK,["Druk het vlees plat: haal het vlees met een schuimspaan uit de pan en laat 10 minuten afkoelen. Druk de stukken plat tot 1 cm met een zware pan of een vleeshamer en bestrijk ze met een beetje kookvocht.","Schuimspaan, zware pan of vleeshamer"],["Bak het vlees: verhit de olie in een koekenpan op middelhoog vuur. Bak het vlees 3 tot 4 minuten per kant, tot het goudbruin is. Pas op voor spattende olie.","Koekenpan, spatel"],["Serveer: schep de rijst op borden en leg het vlees erbij. Het kookvocht kun je als bouillon of saus gebruiken.","Borden"]],
tip:"Je kunt het vlees een dag eerder koken. Bak het vlees vlak voor het eten."}

st:[MV("dwars op de draad in dunne plakjes van 3 mm"),["Maak de marinade: hak de knoflook fijn en snijd de ui in halve ringen. Meng de sojasaus, suiker, sesamolie en knoflook in een kom. Roer het vlees en de ui erdoor en laat 20 minuten in de koelkast staan.","Mengkom, mes"],RW,RK,["Bak het vlees: verhit de olie in een koekenpan op hoog vuur. Bak het vlees met de ui in twee rondes 2 tot 3 minuten per ronde. Roer vaak. Gooi de rest van de marinade weg.","Koekenpan, spatel"],["Serveer: snijd de lente-ui in ringen. Schep de rijst op borden, leg het vlees erop en strooi sesamzaad en lente-ui erover.","Borden"]],

st:[MV("dwars op de draad in dunne reepjes"),RW,RK,["Marineer het vlees: meng het vlees in een kom met 1 el sojasaus en 1 tl maizena. Laat 10 minuten staan.","Mengkom"],["Kook de broccoli: snijd de broccoli in kleine roosjes. Kook ze 2 minuten in kokend water en giet ze af.","Pan, vergiet"],["Maak de saus: hak de knoflook en de gember fijn. Meng de rest van de sojasaus, de ketjap, 1 tl maizena en het water in een kleine kom.","Snijplank, mes, kleine kom"],["Bak het vlees: verhit de helft van de olie in een wok op hoog vuur. Bak het vlees 2 minuten en leg het op een bord.","Wok, spatel, bord"],["Bak de groenten: doe de rest van de olie in de wok. Bak de knoflook en gember 30 seconden. Voeg de broccoli toe en bak 2 minuten. Doe het vlees terug en schenk de saus erbij. Bak 1 minuut. Serveer op de rijst.","Wok, spatel, borden"]],

st:[MV("in blokken van 3 cm"),["Snijd de groenten: schil de aardappelen en snijd ze in stukken van 3 cm. Snijd de ui in partjes en hak de pinda’s grof.","Snijplank, mes, schilmesje"],["Bak de pasta: verhit de olie in een grote pan op middelhoog vuur. Bak de ui 2 minuten. Voeg de currypasta toe en bak 1 minuut. Doe het vlees erbij en bak 4 minuten.","Grote pan, houten lepel"],["Stoof het vlees: schenk de kokosmelk en het water erbij. Leg het deksel half op de pan en laat 1 uur zachtjes koken. Roer af en toe.","Grote pan met deksel"],RW,RK,["Voeg de aardappel toe: doe de aardappel in de pan en laat nog 25 minuten koken, tot het vlees en de aardappel zacht zijn.","Grote pan"],["Maak af: roer de tamarinde, vissaus en suiker erdoor en proef. Strooi de pinda’s erover en serveer op de rijst.","Borden"]],

st:[RW,RK,["Snijd de ui en de knoflook: snijd de ui fijn en hak de knoflook fijn. Houd de helft van beide apart voor de saus.","Snijplank, mes"],["Maak de gehaktballen: meng het gehakt in een kom met het paneermeel, het ei, het zout, 1 el ketjap en de helft van de ui en knoflook. Rol 16 balletjes met natte handen. Was daarna je handen met zeep.","Mengkom"],["Bak de balletjes: verhit de olie in een koekenpan op middelhoog vuur. Bak de balletjes 6 minuten en draai ze rond tot ze bruin zijn.","Koekenpan, houten lepel"],["Maak de saus: voeg de rest van de ui en knoflook toe en bak 2 minuten. Schenk de tomatenblokjes, 2 el ketjap, de sambal en de suiker erbij. Leg het deksel op de pan en laat 12 minuten zachtjes koken. De balletjes zijn gaar als ze binnenin niet meer roze zijn.","Koekenpan met deksel, houten lepel"],["Serveer: schep de rijst op borden en leg de balletjes met saus erbij.","Borden"]],
tip:"Je kunt de balletjes ook in de oven bakken, 20 minuten op 200 °C."}

st:[MV("in blokken van 3 cm"),["Snijd de rest: snijd de gember in plakjes, hak de knoflook fijn en snijd de lente-ui in stukken van 4 cm.","Snijplank, mes"],["Bak het vlees: verhit de olie in een braadpan op hoog vuur. Bak het vlees in twee rondes tot het bruin is. Voeg de gember, knoflook en de suiker toe en bak 2 minuten.","Braadpan, houten lepel"],["Stoof het vlees: schenk de sojasaus en het water erbij en voeg de steranijs en de lente-ui toe. Leg het deksel half op de pan en laat 70 minuten zachtjes koken. Roer af en toe.","Braadpan met deksel"],RW,RK,["Laat de saus inkoken: haal het deksel van de pan en laat de saus 10 minuten inkoken tot hij glanst. Haal de steranijs eruit.","Braadpan, houten lepel"],["Serveer: schep de rijst op borden en leg het vlees met saus erbij.","Borden"]],

st:[["Maak de dressing: pers de limoenen uit. Roer het sap in een kleine kom met de vissaus en de suiker tot de suiker is opgelost. Snijd de peper in dunne ringetjes en roer ze erdoor.","Kleine kom, mes"],["Bak het vlees: dep de biefstuk droog met keukenpapier. Verhit de olie in een koekenpan op hoog vuur. Bak de biefstuk 3 minuten per kant voor medium. Leg hem 5 minuten te rusten onder folie. Maak daarna je handen, het mes en de plank schoon met heet water en afwasmiddel.","Keukenpapier, koekenpan, tang"],["Snijd de groenten: snijd de komkommer in plakjes, de tomaten in partjes en de lente-ui in ringen. Pluk de koriander.","Snijplank, mes"],["Snijd het vlees: snijd de biefstuk dwars op de draad in dunne plakken.","Snijplank, mes"],["Meng en serveer: doe de groenten en het vlees op een grote schaal. Schenk de dressing erover en meng voorzichtig. Serveer meteen.","Grote schaal, borden"]],

st:[KV,["Maak de kruidenpasta: schil de sjalotten, knoflook, gember en kurkuma. Haal de zaadjes uit de peper. Maal alles met een scheut water fijn met de staafmixer. Sla het citroengras plat.","Staafmixer, mes"],["Bak de pasta: verhit de olie in een braadpan op middelhoog vuur. Bak de kruidenpasta 4 minuten en roer vaak. Voeg het citroengras en de ketoembar toe. Doe de kip erbij en bak 5 minuten.","Braadpan, houten lepel"],["Laat de kip garen: schenk de kokosmelk en het water erbij. Voeg de suiker en het zout toe, breng aan de kook, zet het vuur laag en leg het deksel half op de pan. Laat 25 minuten zachtjes koken en roer af en toe.","Braadpan met deksel"],RW,RK,["Laat de saus inkoken: haal het deksel van de pan en laat nog 25 minuten koken, tot de saus donker en bijna droog is. Roer vaak. Haal het citroengras eruit. De kip is gaar als er geen roze meer te zien is en het sap helder is.","Braadpan, houten lepel"],["Serveer: schep de rijst op borden en leg de kip met saus erbij.","Borden"]],

st:[["Verwarm de oven voor: zet de oven op 200 °C.","Oven"],FP("in 4 gelijke stukken"),["Maak de kruidenpasta: schil de sjalotten, knoflook, gember en kurkuma. Haal de zaadjes uit de peper. Maal alles met de olie, het zout en het limoensap fijn met de staafmixer, of hak het heel fijn.","Staafmixer of mes, mengkom"],["Maak de pakketjes: smeer de pasta over de vis. Leg elk stuk vis op een vel bakpapier met een plakje tomaat en een paar blaadjes basilicum. Vouw het bakpapier dicht en pak het in folie. Leg de pakketjes op een bakplaat.","Bakpapier, aluminiumfolie, bakplaat"],RW,RK,["Gaar de vis: zet de bakplaat 18 tot 20 minuten in de oven. De vis is gaar als hij ondoorzichtig is en makkelijk uit elkaar valt. Open de pakketjes voorzichtig, want er komt hete stoom uit.","Oven, bakplaat"],["Serveer: schep de rijst op borden en leg het pakketje erbij.","Borden"]],

ing:[["Visfilet",600,"g","s"],["Verse gember",4,"cm","s",[2,"tl","gemberpoeder"]],["Lente-ui",3,"stuk|stuks","s"],["Sojasaus",3,"el","s"],["Sesamolie",1,"tl","t"],["Zonnebloemolie",2,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[FP("in 4 gelijke stukken"),RW,RK,["Snijd de gember en de lente-ui: schil de gember en snijd hem in dunne reepjes. Snijd de lente-ui in dunne reepjes van 5 cm.","Snijplank, mes"],["Stoom de vis: giet 3 cm water in een wok en zet er een rooster of omgekeerd kommetje in. Leg de vis op een hittebestendig bord met de helft van de gember. Zet het bord op het rooster, leg het deksel op de wok en breng het water aan de kook. Stoom 8 tot 10 minuten. De vis is gaar als hij ondoorzichtig is.","Wok met deksel, rooster, hittebestendig bord"],["Maak de saus: meng de sojasaus en de sesamolie. Verhit de olie in een kleine pan tot hij heet is.","Kleine pan"],["Serveer: haal het bord voorzichtig uit de wok. Leg de lente-ui en de rest van de gember op de vis. Giet de hete olie erover, schenk de sojasaus erbij en serveer met rijst. Pas op voor spatten.","Borden"]],
tip:"Neem het bord met twee droge ovenhandschoenen uit de hete wok."}

ing:[["Visfilet (stevige vis)",500,"g","s"],["Rode currypasta",3,"el","t"],["Kokosmelk",400,"ml","s"],["Water",150,"ml"],["Paprika",1,"stuk|stuks","s"],["Sperziebonen",100,"g","s"],["Vissaus",1,"el","t"],["Bruine suiker",1,"tl","s"],["Limoen",1,"stuk|stuks","s"],["Verse basilicum",15,"g","s",[1,"tl","gedroogde basilicum"]],["Zonnebloemolie",1,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[FP("in blokken van 4 cm"),["Snijd de groenten: snijd de paprika in repen en halveer de sperziebonen. Pluk de basilicumblaadjes.","Snijplank, mes"],RW,RK,["Bak de pasta: verhit de olie in een wok op middelhoog vuur en bak de currypasta 1 minuut.","Wok, houten lepel"],["Maak de curry: schenk de kokosmelk en het water erbij en breng aan de kook. Voeg de paprika en de bonen toe en kook 8 minuten zachtjes.","Wok, houten lepel"],["Gaar de vis: leg de vis voorzichtig in de curry en kook 5 minuten zachtjes. Roer niet te veel. Roer de vissaus en de suiker erdoor, knijp er een half limoen in en strooi de basilicum erover. Serveer op de rijst.","Wok, borden"]],
tip:"Voeg de vis als laatste toe, dan blijft hij heel."}

gerei:["Zeef","Pan met deksel of rijstkoker","Vork","Keukenpapier","Snijplank","Scherp mes","Vergiet","Wok of koekenpan","Houten lepel","Borden"],
ing:[["Garnalen (gepeld, ontdooid)",400,"g","s"],["Ketjap manis",3,"el","t"],["Knoflook",4,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Sjalotten",2,"stuk|stuks","s",[2,"tl","uienpoeder"]],["Verse rode peper",1,"stuk|stuks","s",[1,"tl","sambal oelek"]],["Tomaten",1,"stuk|stuks","s"],["Limoen",1,"stuk|stuks","s",[1,"el","limoensap uit een flesje"]],["Zonnebloemolie",3,"el","s"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[GAR,RW,RK,["Snijd de rest: hak de knoflook, gember, sjalot en peper fijn. Snijd de tomaat in stukjes.","Snijplank, mes"],["Bak de aroma’s: verhit de olie in een wok op middelhoog vuur. Bak de knoflook, gember, sjalot en peper 2 minuten.","Wok, houten lepel"],["Bak de garnalen: zet het vuur hoog en doe de garnalen in de wok. Bak 3 minuten tot ze roze zijn. Voeg de ketjap en de tomaat toe en bak 2 minuten.","Wok, houten lepel"],["Maak af en serveer: knijp de limoen erover. Schep de rijst op borden en leg de garnalen erbij.","Borden"]],
tip:"Bak garnalen kort, anders worden ze taai."}
,{id:"nasi-goreng-udang",naam:"Nasi goreng met garnalen",keuken:"Indonesisch",c:"#1E4FA3",tijd:45,kcal:530,niv:"Makkelijk",

gerei:["Zeef","Pan met deksel of rijstkoker","Vork","Vergiet","Keukenpapier","Snijplank","Scherp mes","Groot bord","Wok","Spatel","Kleine koekenpan","Borden"],
ing:[["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"],["Garnalen (gepeld, ontdooid)",300,"g","s"],["Sjalotten",2,"stuk|stuks","s",[2,"tl","uienpoeder"]],["Knoflook",3,"teen|tenen","s",[1,"tl","knoflookpoeder"]],["Verse rode peper",1,"stuk|stuks","s",[1,"tl","sambal oelek"]],["Ketjap manis",4,"el","t"],["Eieren",4,"stuk|stuks","s"],["Zonnebloemolie",3,"el","s"],["Gebakken uitjes",3,"el","t"],["Komkommer",1,"stuk|stuks","s"],["Tomaten",2,"stuk|stuks","s"]],
st:[RW,RK,["Snijd de groenten: schil de sjalotten en snijd ze fijn. Hak de knoflook fijn. Snijd de peper door de lengte, haal de zaadjes eruit en snijd hem fijn. Was daarna je handen.","Snijplank, mes"],GAR,["Laat de rijst afkoelen: heb je de rijst de dag ervoor al gekookt? Sla deze stap dan over. Schep anders de rijst op een groot bord en laat hem afkoelen terwijl je de garnalen bakt. Zet rijst die je niet gebruikt binnen 1 uur in de koelkast.","Groot bord"],["Bak de garnalen: verhit de helft van de olie in een wok op hoog vuur. Bak de garnalen 2 minuten tot ze roze zijn en leg ze op een bord.","Wok, spatel, bord"],["Bak de aroma’s: doe de rest van de olie in de wok. Bak de sjalot, knoflook en peper 2 minuten.","Wok, spatel"],["Bak de rijst: voeg de rijst en de ketjap toe. Bak 5 minuten op hoog vuur en roer steeds. Doe de garnalen terug in de wok en bak 1 minuut.","Wok, spatel"],["Bak de eieren en serveer: bak de eieren als spiegelei in een koekenpan. Schep de rijst op borden, leg een ei erop en strooi de gebakken uitjes erover. Serveer met plakjes komkommer en tomaat.","Kleine koekenpan, mes, borden"]],
tip:"Bak de garnalen apart, dan blijven ze sappig."}

ing:[["Zalmfilet (zonder huid)",600,"g","s"],["Ketjap manis voor de marinade",2,"el","t"],["Limoen",1,"stuk|stuks","s",[1,"el","limoensap uit een flesje"]],["Knoflook",2,"teen|tenen","s",[0.5,"tl","knoflookpoeder"]],["Verse gember",2,"cm","s",[1,"tl","gemberpoeder"]],["Zonnebloemolie",2,"el","s"],["Satéstokjes",12,"stuk|stuks","s"],["Ketjap manis voor de dip",3,"el","t"],["Sambal oelek",1,"tl","t"],["Jasmijnrijst (ongekookt)",280,"g","s"],["Water voor de rijst",420,"ml"]],
st:[["Week de stokjes: doe dit als eerste. Leg de satéstokjes 20 minuten in een bak met water.","Bak of kom"],FP("in blokken van 3 cm"),["Maak de marinade: hak de knoflook en gember fijn en meng ze in een kom met 2 el ketjap, het sap van de helft van de limoen en 1 el olie. Draai de zalm er voorzichtig door en laat 15 minuten in de koelkast staan.","Mengkom"],RW,RK,["Maak de dip: meng 3 el ketjap, de sambal en het sap van de rest van de limoen in een kleine kom.","Kleine kom"],["Rijg de spiesjes: prik 4 stukken zalm aan elk stokje. Was daarna je handen.","Satéstokjes"],["Grill de spiesjes: bestrijk de grillpan met de rest van de olie en verhit hem op middelhoog vuur. Bak de spiesjes 6 tot 8 minuten en draai ze voorzichtig om. Serveer met rijst en de dip.","Grillpan, visspatel, borden"]],
tip:"Draai de spiesjes met een visspatel, ze breken makkelijk."}

{"id":"lumpia-groenten","naam":"Lumpia met groenten","keuken":"Indonesisch","tijd":45,"kcal":210,"niv":"Gemiddeld","intro":"Krokante loempia’s gevuld met fijngesneden groenten en glasnoedels. Lekker als snack met een frisse chilisaus.","all":["Gluten (in loempiavellen)","Soja (optioneel, in sojasaus)"],"gerei":["Snijplank","Scherp mes","Kom","Wok of koekenpan","Keukenpapier","Pan om te frituren","Keukentang"],"ing":[["Loempiavellen",8,"stuk|stuks"],["Wortel",150,"g"],["Witte kool",200,"g"],["Taugé",100,"g"],["Glasnoedels",50,"g"],["Knoflook",2,"teen|tenen"],["Sojasaus",1,"el"],["Zonnebloemolie",1,"el"],["Olie om te frituren",700,"ml"]],"st":[["Bereid de vulling: week de glasnoedels volgens de verpakking. Snijd ze korter. Snijd wortel en kool in dunne reepjes en hak de knoflook fijn.","Kom, snijplank en mes"],["Roerbak de vulling: verhit een eetlepel olie. Bak de knoflook kort, voeg wortel en kool toe en bak enkele minuten. Schep taugé, glasnoedels en sojasaus erdoor. Laat de vulling volledig afkoelen.","Wok of koekenpan en spatel"],["Vul de vellen: leg een loempiavel als ruit neer. Schep een beetje vulling op het onderste deel, vouw de zijkanten naar binnen en rol stevig op. Maak de rand met een beetje water dicht.","Schoon werkblad en kommetje water"],["Frituur de lumpia: verhit de olie tot ongeveer 175 °C. Frituur in kleine porties goudbruin en krokant. Laat uitlekken op keukenpapier.","Pan, keukentang en keukenpapier"]],"tip":"Laat de vulling goed afkoelen en niet te nat zijn. Zo scheuren de vellen minder snel en worden de lumpia krokant.","snack":true},
{"id":"pisang-goreng","naam":"Pisang goreng","keuken":"Indonesisch","tijd":25,"kcal":260,"niv":"Makkelijk","intro":"Banaan in een licht krokant beslag. Een bekende Indonesische zoete snack voor bij de thee.","all":["Gluten (tarwebloem)","Ei (optioneel, afhankelijk van beslag)"],"gerei":["Mengkom","Garde","Snijplank","Mes","Pan om te frituren","Keukentang","Keukenpapier"],"ing":[["Rijpe maar stevige bananen",4,"stuk|stuks"],["Tarwebloem",120,"g"],["Rijstmeel",40,"g"],["Bakpoeder",1,"tl"],["Suiker",1,"el"],["Koud water",150,"ml"],["Zout",1,"snuf"],["Olie om te frituren",700,"ml"]],"st":[["Maak het beslag: meng tarwebloem, rijstmeel, bakpoeder, suiker en zout. Klop het koude water erdoor tot een glad, dik beslag.","Mengkom en garde"],["Snijd de bananen: pel de bananen en snijd ze in de lengte doormidden of in schuine plakken.","Snijplank en mes"],["Verhit de olie: verwarm de olie in een stevige pan tot ongeveer 175 °C.","Pan en keukenthermometer"],["Bak de bananen: haal de stukken banaan door het beslag en frituur ze in kleine porties goudbruin. Laat uitlekken op keukenpapier en serveer warm.","Pan, keukentang en keukenpapier"]],"tip":"Gebruik bananen die rijp zijn, maar nog stevig aanvoelen. Een beetje rijstmeel maakt het beslag extra krokant.","snack":true},
{"id":"bakwan-sayur","naam":"Bakwan sayur","keuken":"Indonesisch","tijd":30,"kcal":190,"niv":"Makkelijk","intro":"Hartige Indonesische groentefritters met een kruidig, krokant randje. Serveer met sambal of chilisaus.","all":["Gluten (tarwebloem)","Soja (afhankelijk van saus)"],"gerei":["Mengkom","Garde","Rasp","Snijplank","Mes","Pan om te frituren","Keukentang"],"ing":[["Tarwebloem",150,"g"],["Rijstmeel",40,"g"],["Wortel",100,"g"],["Witte kool",150,"g"],["Bosui",2,"stuk|stuks"],["Knoflook",2,"teen|tenen"],["Ketoembar",1,"tl"],["Kurkuma",0.5,"tl"],["Water",160,"ml"],["Zout",1,"tl"],["Olie om te frituren",700,"ml"]],"st":[["Snijd de groenten: rasp de wortel, snijd de kool in dunne reepjes en de bosui in ringetjes. Hak de knoflook fijn.","Rasp, snijplank en mes"],["Maak het beslag: meng bloem, rijstmeel, ketoembar, kurkuma en zout. Voeg het water toe en roer tot een stevig beslag. Schep de groenten en knoflook erdoor.","Mengkom en garde"],["Verhit de olie: verwarm de olie in een pan tot ongeveer 175 °C.","Pan en keukenthermometer"],["Bak de fritters: schep kleine hoopjes beslag in de hete olie. Bak ze aan beide kanten goudbruin en gaar. Laat uitlekken op keukenpapier.","Twee lepels, keukentang en keukenpapier"]],"tip":"Maak de fritters niet te groot. Kleine porties bakken gelijkmatiger en worden rondom krokant.","snack":true,"veg":true},
{"id":"tahu-isi","naam":"Tahu isi","keuken":"Indonesisch","tijd":40,"kcal":230,"niv":"Gemiddeld","intro":"Gevulde en krokant gebakken tofu met groenten. Een hartige snack die ook vegetarisch goed vult.","all":["Gluten (tarwebloem)","Soja (tofu)"],"gerei":["Snijplank","Mes","Kom","Koekenpan","Lepel","Pan om te frituren","Keukentang"],"ing":[["Stevige tofu",4,"blok|blokken"],["Wortel",100,"g"],["Witte kool",100,"g"],["Taugé",75,"g"],["Knoflook",2,"teen|tenen"],["Tarwebloem",100,"g"],["Rijstmeel",30,"g"],["Water",150,"ml"],["Kurkuma",0.5,"tl"],["Zout",1,"tl"],["Olie om te frituren",700,"ml"]],"st":[["Maak de vulling: snijd wortel en kool fijn. Hak de knoflook. Bak de groenten met de taugé kort in een beetje olie en laat afkoelen.","Snijplank, mes en koekenpan"],["Bereid de tofu: snijd de blokken tofu diagonaal doormidden. Maak voorzichtig een opening en hol het midden een beetje uit. Vul met het groentemengsel.","Mes en theelepel"],["Maak het beslag: meng bloem, rijstmeel, kurkuma en zout met het water tot een glad beslag.","Kom en garde"],["Frituur de tahu isi: haal de gevulde tofu door het beslag en frituur in porties goudbruin. Laat uitlekken op keukenpapier.","Pan, keukentang en keukenpapier"]],"tip":"Dep de tofu eerst droog. Zo hecht het beslag beter en spat de hete olie minder.","snack":true,"veg":true},
{"id":"perkedel-kentang","naam":"Perkedel kentang","keuken":"Indonesisch","tijd":50,"kcal":230,"niv":"Gemiddeld","intro":"Indonesische aardappelkoekjes met corned beef. Je kunt de corned beef ook vervangen door rul gebakken rundergehakt.","all":["Ei"],"gerei":["Pan","Pureestamper","Koekenpan","Mengkom","Spatel"],"ing":[["Kruimige aardappelen",600,"g"],["Corned beef (of rundergehakt als alternatief)",150,"g"],["Sjalotten",2,"stuk|stuks"],["Selderij",10,"g"],["Ei",1,"stuk"],["Ketoembar",1,"tl"],["Nootmuskaat",0.25,"tl"],["Zout",1,"tl"],["Zwarte peper",0.5,"tl"],["Zonnebloemolie",3,"el"]],"st":[["Kook de aardappelen: schil de aardappelen, snijd ze in stukken en kook ze gaar. Giet goed af en laat goed uitdampen.","Pan en vergiet"],["Bak de sjalot en bereid het vlees: snijd de sjalotten fijn en bak ze zacht en licht goudbruin. Gebruik je rundergehakt in plaats van corned beef? Bak het gehakt dan in een aparte koekenpan rul en volledig gaar. Gebruik je corned beef, maak die dan met een vork los.","Koekenpan en spatel"],["Maak het mengsel: stamp de aardappelen grof. Meng met de corned beef óf het gebakken gehakt, de sjalot, selderij, ketoembar, nootmuskaat, zout en peper. Proef en vorm kleine platte koekjes. Laat ze kort opstijven.","Pureestamper en mengkom"],["Bak de perkedel: klop het ei los en haal de koekjes erdoor. Verhit de olie in een koekenpan en bak de perkedel aan beide kanten goudbruin en door en door warm.","Kom, koekenpan en spatel"]],"tip":"Laat de aardappelen na het koken goed uitdampen. Kies corned beef of rundergehakt; gebruik niet beide. Bak gehakt altijd volledig gaar voordat je het door het aardappelmengsel mengt.","snack":true},
{"id":"mini-martabak-telur","naam":"Mini martabak telur","keuken":"Indonesisch","tijd":40,"kcal":240,"niv":"Gemiddeld","intro":"Kleine krokante pakketjes gevuld met ei, bosui en gekruid gehakt. Ideaal om te delen.","all":["Gluten (loempiavellen)","Ei"],"gerei":["Mengkom","Snijplank","Mes","Koekenpan","Pan om te bakken","Keukentang"],"ing":[["Loempiavellen",8,"stuk|stuks"],["Rundergehakt",200,"g"],["Eieren",2,"stuk|stuks"],["Bosui",3,"stuk|stuks"],["Ui",1,"stuk"],["Kerriepoeder",1,"tl"],["Zwarte peper",0.5,"tl"],["Zout",0.5,"tl"],["Olie om te bakken",3,"el"]],"st":[["Bak het gehakt: snipper de ui. Bak het gehakt rul en gaar met de ui, kerriepoeder, peper en zout. Laat iets afkoelen.","Koekenpan en spatel"],["Maak de vulling: snijd de bosui in ringetjes. Klop de eieren los en meng met bosui en het afgekoelde gehakt.","Mengkom en mes"],["Vouw de pakketjes: leg een loempiavel neer, schep wat vulling in het midden en vouw tot een plat vierkant pakketje. Gebruik een tweede vel als het eerste dun of gescheurd is.","Schoon werkblad"],["Bak de martabak: verhit een laagje olie in een koekenpan. Bak de pakketjes op middelhoog vuur aan beide kanten goudbruin. Zorg dat de eivulling volledig gestold en het gehakt door en door gaar is.","Koekenpan en spatel"]],"tip":"Vul de pakketjes pas vlak voor het bakken. Zo wordt het loempiavel niet vochtig.","snack":true},
{"id":"onde-onde","naam":"Onde-onde","keuken":"Indonesisch","tijd":60,"kcal":220,"niv":"Gemiddeld","intro":"Chewy sesamballetjes van kleefrijstmeel met een zoete mungbonenvulling. Een geliefde Indonesische zoete snack.","all":["Sesamzaad"],"gerei":["Pan","Zeef","Kom","Steelpan","Lepel","Pan om te frituren","Schuimspaan"],"ing":[["Gele mungbonen (gesplitst)",120,"g"],["Suiker",70,"g"],["Kleefrijstmeel",180,"g"],["Aardappelzetmeel",20,"g"],["Lauw water",140,"ml"],["Sesamzaad",70,"g"],["Zout",1,"snuf"],["Olie om te frituren",700,"ml"]],"st":[["Kook de vulling: spoel de mungbonen en kook ze gaar volgens de verpakking. Giet goed af. Pureer met de suiker tot een stevige pasta en laat volledig afkoelen.","Pan, zeef en lepel"],["Maak het deeg: meng kleefrijstmeel, aardappelzetmeel en zout. Voeg beetje bij beetje lauw water toe en kneed tot een soepel deeg.","Kom"],["Vorm de balletjes: verdeel de vulling in kleine porties. Maak balletjes van het deeg, druk plat, leg vulling in het midden en sluit zorgvuldig. Rol door het sesamzaad.","Schoon werkblad en bord"],["Frituur rustig: verwarm de olie op laag tot middelhoog vuur. Frituur de balletjes rustig en draai ze regelmatig tot ze goudkleurig en gaar zijn. Laat uitlekken.","Pan, schuimspaan en keukenpapier"]],"tip":"Sluit het deeg helemaal om de vulling. Frituur op gematigde temperatuur zodat de buitenkant niet te snel kleurt.","snack":true,"veg":true},
{"id":"kipkaraage","naam":"Japanse kipkaraage","keuken":"Japans","tijd":35,"kcal":310,"niv":"Makkelijk","intro":"Japanse krokante kipstukjes met gember, knoflook en sojasaus. Serveer met partjes citroen en eventueel mayonaise.","all":["Soja","Gluten (afhankelijk van sojasaus)","Ei (optioneel, in mayonaise)"],"gerei":["Snijplank","Mes","Kom","Pan om te frituren","Keukentang","Keukenpapier"],"ing":[["Kipdijfilet",400,"g"],["Sojasaus",2,"el"],["Verse gember",15,"g"],["Knoflook",2,"teen|tenen"],["Aardappelzetmeel",80,"g"],["Zwarte peper",0.5,"tl"],["Olie om te frituren",800,"ml"],["Mayonaise",4,"el"]],"st":[["Snijd en marineer de kip: snijd de kip in gelijke hapklare stukken. Meng met sojasaus, fijn geraspte gember, knoflook en peper. Laat 15 minuten marineren in de koelkast.","Snijplank, mes en kom"],["Bereid de kip voor: haal de kip uit de koelkast. Wentel de stukken vlak voor het bakken door het aardappelzetmeel.","Schaal"],["Verhit de olie: verwarm de olie in een stevige pan tot ongeveer 170 °C.","Pan en keukenthermometer"],["Frituur de karaage: bak de kip in kleine porties tot de stukken rondom goudbruin zijn en volledig gaar zijn. Snijd bij twijfel een groot stuk open en controleer dat het midden niet meer rauw is. Laat uitlekken en serveer met mayonaise.","Pan, keukentang en keukenpapier"]],"tip":"Bak niet te veel kip tegelijk. Zo blijft de olie heet genoeg en wordt de korst krokant. Verhit de kip volledig gaar; rauwe kip is niet veilig om te eten.","snack":true},
{"id":"gyoza","naam":"Gyoza met varkensvlees","keuken":"Japans","tijd":45,"kcal":320,"niv":"Gemiddeld","intro":"Japanse dumplings gevuld met gekruid varkensgehakt, knapperige kool, bosui, gember en knoflook. Eerst goudbruin gebakken en daarna met een beetje water gaar gestoomd.","all":["Gluten (gyozavellen)","Soja","Sesam"],"gerei":["Snijplank","Scherp mes","Rasp","Mengkom","Lepel","Koekenpan met passend deksel","Spatel","Keukenpapier"],"ing":[["Gyozavellen",24,"stuk|stuks"],["Varkensgehakt",300,"g"],["Chinese kool",150,"g"],["Bosui",2,"stuk|stuks"],["Knoflook",2,"teen|tenen"],["Verse gember",2,"cm"],["Sojasaus",2,"el"],["Sesamolie",1,"el"],["Zout",0.25,"tl"],["Zwarte peper",0.25,"tl"],["Zonnebloemolie om te bakken",1,"el"],["Water om te stomen",100,"ml"],["Sojasaus voor de dipsaus",3,"el"],["Rijstazijn voor de dipsaus",2,"el"],["Chiliolie (optioneel)",1,"tl"]],"st":[["Bereid de kool: snijd de Chinese kool heel fijn. Meng met een klein beetje zout en laat 10 minuten staan. Knijp daarna het vocht er goed uit, zodat de vulling niet te nat wordt.","Snijplank, mes en mengkom"],["Maak de vulling: snijd de bosui fijn en rasp de gember. Hak de knoflook fijn. Meng het varkensgehakt met de kool, bosui, knoflook, gember, sojasaus, sesamolie, zout en peper tot alles goed verdeeld is.","Mengkom, mes en rasp"],["Vul de gyoza: leg een gyozavel in je hand. Schep ongeveer een theelepel vulling in het midden. Maak de rand licht vochtig met water, vouw het vel dubbel en druk de rand stevig dicht. Maak eventueel kleine plooitjes aan één kant. Herhaal dit met de rest.","Schoon werkblad, lepel en kommetje water"],["Bak de onderkant: verhit de zonnebloemolie in een koekenpan op middelhoog vuur. Zet de gyoza rechtop in de pan met de platte kant naar beneden. Bak ze 2 tot 3 minuten tot de onderkant goudbruin is.","Koekenpan en spatel"],["Stoom de vulling gaar: schenk voorzichtig het water in de pan en doe direct het deksel erop. Laat 6 tot 8 minuten stomen, tot het water bijna verdampt is en de vulling volledig gaar is. Haal het deksel eraf en laat de onderkant nog kort krokant worden. Snijd bij twijfel een gyoza open om te controleren of het gehakt helemaal gaar is.","Koekenpan met deksel en spatel"],["Maak de dipsaus en serveer: meng de sojasaus met de rijstazijn en eventueel de chiliolie. Serveer de gyoza direct met de dipsaus.","Kleine kom en lepel"]],"tip":"Leg de gevulde gyoza op een licht met bloem bestoven bord en dek ze af met een schone doek. Bak ze in porties en leg ze niet te dicht op elkaar. Zorg dat het varkensgehakt volledig gaar is voordat je ze serveert.","snack":true}

function kennisbank(){var items=[
['Ketoembar (korianderzaad)','Kruiden en specerijen','Ketoembar is gemalen korianderzaad. Het heeft een warme, licht citrusachtige smaak en wordt veel gebruikt in Indonesische boemboes, marinades en curry’s. Bak het kort mee om de geur vrij te laten komen.','Heel korianderzaad is krachtiger en kun je zelf malen.'],
['Koenjit (kurkuma)','Kruiden en specerijen','Koenjit geeft gerechten een aardse smaak en een goudgele kleur. Gebruik het in nasi, curry’s, soepen en marinades. Een kleine hoeveelheid is vaak genoeg.','Vervang verse kurkuma door ongeveer een derde tot de helft van de hoeveelheid poeder.'],
['Laos','Kruiden en specerijen','Laos is familie van gember, maar smaakt frisser, scherper en wat dennenachtig. Het wordt vaak gebruikt in Indonesische en Thaise soepen en curry’s.','Gedroogde laos is handig voor bouillon; verse laos geeft een frissere smaak.'],
['Trassi','Kruiden en specerijen','Trassi is gefermenteerde garnalenpasta met een uitgesproken hartige smaak. Verhit een klein stukje mee in boemboe. De geur wordt tijdens het bakken milder.','Niet geschikt bij een schaaldierenallergie; laat weg of kies een passend alternatief.'],
['Salamblad','Kruiden en specerijen','Salamblad is een aromatisch Indonesisch blad dat vaak wordt meegetrokken in rijst, stoofgerechten en curry’s. Haal het blad voor het serveren uit het gerecht.','Niet hetzelfde als laurierblad; laurier kan alleen als noodoplossing dienen.'],
['Citroengras (sereh)','Kruiden en specerijen','Citroengras geeft een frisse citrussmaak aan soepen, curry’s en marinades. Kneus de stengel voordat je hem meekookt en verwijder de harde delen voor het eten.','Gebruik eventueel wat limoenschil, maar de smaak is anders.'],
['Vijfkruidenpoeder','Kruiden en specerijen','Een Chinese specerijenmix die vaak steranijs, venkel, kaneel, kruidnagel en Sichuanpeper bevat. Sterk aromatisch: begin met weinig.','Bewaar luchtdicht en donker om het aroma te behouden.'],
['Sambal oelek','Sauzen en smaakmakers','Een pittige Indonesische chilipasta, meestal gemaakt van rode pepers en zout. Voeg beetje bij beetje toe en proef tussendoor.','Chilivlokken of verse chili kunnen als alternatief dienen.'],
['Ketjap manis','Sauzen en smaakmakers','Indonesische zoete sojasaus met een stroperige structuur. Geeft marinades, nasi en sauzen kleur, zout en zoetheid. Bevat doorgaans soja en vaak tarwe.','Ketjap asin is zouter en niet één-op-één uitwisselbaar.'],
['Wok','Kookgerei','Een wok heeft hoge schuine randen en is geschikt om ingrediënten snel op hoge temperatuur te roerbakken. Werk in kleine porties zodat de pan heet blijft.','Een ruime koekenpan werkt ook, maar heeft minder hoge randen.'],
['Rijstkoker','Kookgerei','Een rijstkoker kookt rijst automatisch en schakelt meestal over op warmhouden. Volg de waterverhouding van de fabrikant; die kan verschillen per rijstsoort.','Spoel rijst indien gewenst eerst en laat na het koken even rusten.'],
['Vijzel (ulekan)','Kookgerei','Met een vijzel maal en kneus je specerijen, pepers, knoflook en sjalot tot een pasta. Zo komen aroma’s vrij zonder alles volledig glad te maken.','Een keukenmachine kan ook, maar geeft vaak een gladdere pasta.'],
['Stoommandje','Kookgerei','Een stoommandje houdt ingrediënten boven kokend water. De stoom gaart vis, groenten en dumplings voorzichtig. Houd het water onder de bodem van het mandje.','Een metalen inzet of stoomrek in een passende pan kan ook.'],
['Keukenweegschaal','Meet- en bereidingsgerei','Een digitale weegschaal helpt om hoeveelheden nauwkeurig af te meten. Vooral bij bakken, rijst en kruidenmixen geeft wegen een beter reproduceerbaar resultaat.','Zet de weegschaal op nul met de kom erop (tarra).'],
['Daun jeruk (limoenblad)','Kruiden en specerijen','Daun jeruk zijn aromatische blaadjes die Indonesische en Thaise gerechten een frisse, bloemige geur geven. Kneus het blad licht en laat het meekoken in curry, soep of stoofgerecht.','Haal de blaadjes voor het serveren uit de pan.'],
['Pandanblad','Kruiden en specerijen','Pandan heeft een zachte, zoete geur en wordt gebruikt om rijst, desserts en kokosgerechten te aromatiseren. Knoop een gewassen blad samen en laat het meekoken.','Pandanblad geeft vooral geur af; verwijder het voor het serveren.'],
['Tamarinde','Sauzen en smaakmakers','Tamarinde heeft een uitgesproken fris-zure smaak. De pasta wordt gebruikt in sauzen, soepen, curry’s en marinades.','Begin met een kleine hoeveelheid en proef; de zuurgraad verschilt per product.'],
['Kokosmelk','Sauzen en smaakmakers','Kokosmelk geeft curry’s, soepen en sauzen een romige structuur. Roer een blik goed door voordat je het gebruikt.','Kokosroom bevat doorgaans meer vet dan kokosmelk.'],
['Ketjap asin','Sauzen en smaakmakers','Ketjap asin is Indonesische zoute sojasaus. Gebruik het om nasi, bami, marinades en roerbakgerechten op smaak te brengen.','Het is dunner en zouter dan ketjap manis en niet één-op-één uitwisselbaar.'],
['Vissaus','Sauzen en smaakmakers','Vissaus is een zoute, hartige saus van gefermenteerde vis. Een kleine scheut geeft Thaise en Vietnamese gerechten extra umami.','Voeg beetje bij beetje toe en proef voordat je extra zout gebruikt.'],
['Oestersaus','Sauzen en smaakmakers','Oestersaus is een donkere, hartige saus die vaak wordt gebruikt in Chinese roerbakgerechten. Roer de saus door het gerecht en verwarm kort mee.','Controleer het etiket bij allergieën; oestersaus bevat doorgaans weekdieren.'],
['Tempeh','Ingrediënten','Tempeh is een stevige Indonesische koek van gefermenteerde sojabonen. Snijd hem in plakjes of blokjes en bak, stoom of marineer hem.','Dep tempeh droog voordat je hem bakt voor een goudbruin korstje.'],
['Tofu','Ingrediënten','Tofu wordt gemaakt van sojamelk en heeft een milde smaak. Stevige tofu is geschikt om te bakken; zachte tofu past goed in soepen en sauzen.','Laat stevige tofu uitlekken en dep hem droog voor gebruik.'],
['Jasmijnrijst','Rijst en noedels','Jasmijnrijst is een geurige langkorrelrijst die na het koken zacht en licht kleverig wordt. Volg de waterverhouding op de verpakking of van je rijstkoker.','Laat de rijst na het koken enkele minuten met gesloten deksel rusten.'],
['Rijstnoedels','Rijst en noedels','Rijstnoedels worden gemaakt van rijstmeel en water. Ze zijn verkrijgbaar in verschillende breedtes en worden gebruikt in soepen en roerbakgerechten.','Week of kook ze volgens de aanwijzingen op de verpakking.'],
['Boemboe','Kooktechnieken','Boemboe is een Indonesische kruidenpasta, vaak gemaakt van ui, knoflook, chili, gember en specerijen. Bak de pasta rustig in olie zodat de rauwe geur verdwijnt.','Roer regelmatig en laat de boemboe niet aanbranden.'],
['Roerbakken','Kooktechnieken','Bij roerbakken bereid je ingrediënten kort op hoge temperatuur terwijl je ze omschept. Snijd alles vooraf in gelijke stukken en voeg ingrediënten in porties toe.','Een te volle wok koelt snel af; bak liever in meerdere rondes.'],
['Rijst veilig bewaren','Bewaren en voedselveiligheid','Laat gekookte rijst snel afkoelen, verdeel een grote hoeveelheid over een ondiepe schaal en zet de rijst binnen één uur in de koelkast. Bewaar gekoelde rijst maximaal één dag en verhit hem bij opnieuw eten door en door.','Laat gekookte rijst niet langdurig op kamertemperatuur staan.']
];
